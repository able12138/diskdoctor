name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on macOS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15 ]

    steps:
      - uses: actions/checkout@v4

      - name: 显示环境信息
        run: |
          sw_vers
          swift --version

      - name: 编译（含 smartmontools 引擎）
        run: |
          chmod +x build.sh scripts/*.sh
          ./build.sh

      - name: 校验产物
        run: |
          test -x dist/diskdoctor || { echo "命令行产物缺失"; exit 1; }
          test -d dist/DiskDoctor.app || { echo "App bundle 缺失"; exit 1; }
          test -x dist/DiskDoctor.app/Contents/Resources/smartmontools/smartctl || {
            echo "smartctl 引擎未打包"; exit 1; }
          echo "产物校验通过"

      - name: 冒烟测试
        run: |
          ./dist/diskdoctor list
          ./dist/diskdoctor --help
